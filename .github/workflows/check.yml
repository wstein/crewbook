name: Package checks
on:
  push:
  pull_request:
permissions: {}
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate maintenance and text artifact
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          /usr/bin/python3 -B -m unittest discover -s tools -p 'test_*.py'
          /usr/bin/python3 -B tools/crewbook-package.py check --root "$(pwd -P)"
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: bash tools/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan full history, tree and messages
        shell: bash
        run: bash tools/scan-secrets.sh "$(pwd -P)" "$RUNNER_TEMP/gitleaks"
      - name: Offline scanner failure and redaction fixtures
        env:
          GITLEAKS_TEST_BINARY: ${{ runner.temp }}/gitleaks
        run: python3 -B -m unittest discover -s tools -p 'test_scanner.py'
