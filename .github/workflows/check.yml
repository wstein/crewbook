name: Package checks
on:
  push:
  pull_request:
permissions: {}
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate maintenance and text artifact
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal)"
          go run ./cmd/crewbook-package check --root "$(pwd -P)"
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: bash tools/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan full history, tree and messages
        shell: bash
        run: bash tools/scan-secrets.sh "$(pwd -P)" "$RUNNER_TEMP/gitleaks"
      - name: Offline scanner failure and redaction fixtures
        env:
          GITLEAKS_TEST_BINARY: ${{ runner.temp }}/gitleaks
        run: go test ./internal/cicheck
