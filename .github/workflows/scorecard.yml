name: OpenSSF Scorecard

# Publishes the OpenSSF Scorecard results to scorecard.dev. The API accepts
# results only from a workflow of this shape (ossf/scorecard-action, "Workflow
# restrictions"): no workflow-level env or defaults, no workflow-level write
# permissions, id-token: write on this job only, and only approved actions in
# the job. Keep it free of run steps and extra actions.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  branch_protection_rule:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
